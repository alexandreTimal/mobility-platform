# Hooks git, installés automatiquement par `pnpm install` (postinstall de lefthook).
pre-commit:
  commands:
    biome:
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css}'
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
