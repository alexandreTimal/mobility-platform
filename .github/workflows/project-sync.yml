name: Suivi du projet

# Tient le tableau GitHub Projects à jour à partir des branches et des PR,
# et vérifie les conventions des PR (titre Conventional Commits + issue liée).
# Détails : .github/scripts/project-sync.sh

on:
  push:
    branches-ignore: [main]
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-conventions:
    name: Conventions de PR
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Titre Conventional Commits et issue liée
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          ok=1
          if ! grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' <<<"$TITLE"; then
            echo "::error::Le titre doit suivre Conventional Commits, ex. « feat(web): ajoute le catalogue ». Reçu : « $TITLE »"
            ok=0
          fi
          if ! grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' <<<"$BODY"; then
            echo "::error::La description doit contenir « Closes #N » pour relier la PR à son issue."
            ok=0
          fi
          [ "$ok" = 1 ] && echo "Conventions respectées."
          [ "$ok" = 1 ]

  project-sync:
    name: Synchronisation du tableau
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["opened","reopened","ready_for_review","converted_to_draft","closed"]'), github.event.action)
    runs-on: ubuntu-latest
    concurrency:
      group: project-sync-${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Mettre à jour le statut des issues
        run: bash .github/scripts/project-sync.sh
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_OWNER: alexandreTimal
          PROJECT_NUMBER: 3
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
