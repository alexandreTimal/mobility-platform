name: Bug
description: Signaler un comportement incorrect
title: "fix: "
labels: ["type: bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur…
        2. Cliquer sur…
        3. Constater…
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: dropdown
    id: plateforme
    attributes:
      label: Plateforme
      multiple: true
      options:
        - Web
        - Mobile
        - API / backend
  - type: textarea
    id: environnement
    attributes:
      label: Environnement
      description: Navigateur, appareil / émulateur, version, lecteur d'écran éventuel.
  - type: textarea
    id: logs
    attributes:
      label: Logs ou captures
      render: shell
